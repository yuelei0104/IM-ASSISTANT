spring.application.name=im-user-service
server.port=8081
spring.datasource.url=${IM_MYSQL_URL:jdbc:mysql://127.0.0.1:13307/im_assistant?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.datasource.username=${IM_MYSQL_USER:im_user}
spring.datasource.password=${IM_MYSQL_PASSWORD}
spring.data.redis.host=${IM_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${IM_REDIS_PORT:16380}
spring.mail.host=${IM_SMTP_HOST:}
spring.mail.port=${IM_SMTP_PORT:587}
spring.mail.username=${IM_SMTP_USERNAME:}
spring.mail.password=${IM_SMTP_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
im.auth.mail-from=${IM_SMTP_FROM:}
mybatis.mapper-locations=classpath*:mapper/*.xml
