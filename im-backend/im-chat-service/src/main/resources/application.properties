spring.application.name=im-chat-service
server.port=8082
spring.datasource.url=${IM_MYSQL_URL:jdbc:mysql://127.0.0.1:13307/im_assistant?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.datasource.username=${IM_MYSQL_USER:im_user}
spring.datasource.password=${IM_MYSQL_PASSWORD}
spring.flyway.table=im_chat_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
mybatis.mapper-locations=classpath*:mapper/*.xml
im.user-service.url=${IM_USER_SERVICE_URL:http://127.0.0.1:8081}
spring.data.redis.host=${IM_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${IM_REDIS_PORT:16380}
im.websocket.allowed-origins=${IM_WS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
im.summary.model=${IM_SUMMARY_MODEL:${IM_AGENT_MODEL:qwen3:4b}}
im.summary.port=${IM_OLLAMA_PORT:11434}
im.summary.host=${IM_OLLAMA_HOST:127.0.0.1}
im.agent.model=${IM_AGENT_MODEL:${IM_SUMMARY_MODEL:qwen3:4b}}
# A missing embedding model used to leave this blank, so every Agent request
# answered 503 before it ever reached Ollama. Default to the local 1024-dimension
# model installed with the development stack; set the variable to override it.
im.agent.embedding-model=${IM_AGENT_EMBED_MODEL:qwen3-embedding:0.6b}
im.agent.pgvector.url=${IM_PGVECTOR_URL:jdbc:postgresql://127.0.0.1:15432/im_vectors}
im.agent.pgvector.user=${IM_PGVECTOR_USER:im_vector}
im.agent.pgvector.password=${IM_PGVECTOR_PASSWORD:}
# Rank a pool three times this wide, then prompt with the focused top-k.
# Raising the pool without raising top-k only costs latency; dropping top-k
# below 4 starts losing answers that need two messages together.
im.agent.retrieval-top-k=${IM_AGENT_TOP_K:8}
# Long messages are chunked for embedding but a single prompt entry stays short.
im.agent.message-char-limit=${IM_AGENT_MESSAGE_CHARS:1200}
# Above this many authorized messages the query may use the HNSW index; any
# short approximate result falls back to exact scoring.
im.agent.pgvector.ann-min-ids=${IM_PGVECTOR_ANN_MIN_IDS:1200}
im.agent.pgvector.ann-ef-search=${IM_PGVECTOR_ANN_EF_SEARCH:200}
im.kafka.enabled=${IM_KAFKA_ENABLED:false}
im.kafka.topic=im.chat.notifications.v1
spring.kafka.bootstrap-servers=${IM_KAFKA_BOOTSTRAP:127.0.0.1:19092}
spring.kafka.consumer.group-id=im-chat-redis-bridge-v1
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.listener.ack-mode=manual_immediate
