spring.application.name=im-chat-service
server.port=8082
spring.datasource.url=${IM_MYSQL_URL:jdbc:mysql://127.0.0.1:13307/im_assistant?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${IM_MYSQL_USER:im_user}
spring.datasource.password=${IM_MYSQL_PASSWORD}
spring.flyway.table=im_chat_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
mybatis.mapper-locations=classpath*:mapper/*.xml
im.user-service.url=${IM_USER_SERVICE_URL:http://127.0.0.1:8081}
