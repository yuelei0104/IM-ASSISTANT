server:
  address: 127.0.0.1
  port: 8080
spring:
  application:
    name: im-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: chat-ws
              order: -1
              uri: ws://127.0.0.1:8082
              predicates:
                - Path=/api/chats/ws
                - Header=Upgrade,(?i)websocket
            - id: chat-http
              uri: http://127.0.0.1:8082
              predicates:
                - Path=/api/chats/**
            - id: user-http
              uri: http://127.0.0.1:8081
              predicates:
                - Path=/api/auth/**,/api/contacts/**
management:
  endpoints:
    web:
      exposure:
        include: health
