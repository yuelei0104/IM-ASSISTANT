# Opt-in local two-node exercise. The normal profile still uses one chat node.
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: chat-ws
              order: -1
              uri: "lb:ws://im-chat-service"
              predicates:
                - Path=/api/chats/ws
                - Header=Upgrade,(?i)websocket
            - id: chat-http
              uri: "lb://im-chat-service"
              predicates:
                - Path=/api/chats/**
            - id: user-http
              uri: ${IM_USER_SERVICE_URL:http://127.0.0.1:8081}
              predicates:
                - Path=/api/auth/**,/api/contacts/**
