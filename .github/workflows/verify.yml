name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: im-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'im-backend/**/pom.xml'
      - name: Test Maven modules
        run: bash ./mvnw -B -ntp test

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: im-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: im-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  release-config:
    name: Release configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose --env-file im-backend/deploy/.env.example -f im-backend/deploy/compose.yaml config --quiet
      - name: Validate deployment script
        run: python3 -m unittest discover -s im-backend/deploy -p 'test_*.py'
      - name: Build release images
        run: docker compose --env-file im-backend/deploy/.env.example -f im-backend/deploy/compose.yaml build user chat-a chat-b gateway web
